<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NetDaemon Deploy</title>
<style>
  :root {
    --bg: var(--color-background-primary, #111318);
    --bg-card: var(--color-background-secondary, #1a1d24);
    --bg-subtle: var(--color-background-tertiary, #222631);
    --text: var(--color-text-primary, #e6e8ee);
    --text-muted: var(--color-text-secondary, #9aa3b2);
    --border: var(--color-border-primary, #2c313f);
    --accent: var(--color-text-info, #4f8cff);
    --accent-bg: var(--color-background-info, rgba(79, 140, 255, 0.14));
    --success: var(--color-text-success, #34c77b);
    --success-bg: var(--color-background-success, rgba(52, 199, 123, 0.14));
    --warning: var(--color-text-warning, #f0b429);
    --warning-bg: var(--color-background-warning, rgba(240, 180, 41, 0.14));
    --danger: var(--color-text-danger, #f25f5c);
    --danger-bg: var(--color-background-danger, rgba(242, 95, 92, 0.14));
    --font: var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.45;
  }

  .container {
    max-width: 980px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 0;
  }

  .status-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }
  .stat-box {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
  }
  .stat-sha {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-sub {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .banner {
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid transparent;
  }
  .banner.info { background: var(--accent-bg); border-color: var(--accent); color: var(--text); }
  .banner.warn { background: var(--warning-bg); border-color: var(--warning); color: var(--text); }
  .banner.error { background: var(--danger-bg); border-color: var(--danger); color: var(--text); }
  .banner.success { background: var(--success-bg); border-color: var(--success); color: var(--text); }

  .deploy-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .checkboxes {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .checkboxes label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    font-size: 12.5px;
    user-select: none;
  }

  button, select {
    font-family: var(--font);
    font-size: 12.5px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text);
    padding: 6px 11px;
    cursor: pointer;
    transition: opacity 0.15s, border-color 0.15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.48; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button.success {
    background: var(--success);
    border-color: var(--success);
    color: #0b1a12;
    font-weight: 600;
  }
  button.danger {
    color: var(--danger);
    border-color: var(--border);
  }
  button.danger:hover:not(:disabled) { border-color: var(--danger); background: var(--danger-bg); }
  button.sm, select.sm { padding: 4px 8px; font-size: 12px; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .badge.ok { color: var(--success); background: var(--success-bg); border-color: transparent; }
  .badge.warn { color: var(--warning); background: var(--warning-bg); border-color: transparent; }
  .badge.err { color: var(--danger); background: var(--danger-bg); border-color: transparent; }
  .badge.info { color: var(--accent); background: var(--accent-bg); border-color: transparent; }

  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .row-main {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 220px;
    flex: 1;
  }
  .row-title {
    font-weight: 600;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .row-title a {
    color: var(--text);
    text-decoration: none;
  }
  .row-title a:hover { color: var(--accent); text-decoration: underline; }
  .row-meta {
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .mono { font-family: var(--mono); }
  .diff-add { color: var(--success); font-family: var(--mono); }
  .diff-del { color: var(--danger); font-family: var(--mono); }

  .log-box {
    background: #0c0e13;
    color: #d7dce5;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.5;
    max-height: 280px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .empty {
    color: var(--text-muted);
    font-size: 12.5px;
    padding: 8px 2px;
  }

  .commit-list {
    margin: 6px 0 0 0;
    padding-left: 18px;
    font-size: 12px;
  }
  .commit-list li { margin-bottom: 2px; }

  .toast {
    position: fixed;
    bottom: 14px;
    right: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 13px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    font-size: 12.5px;
    z-index: 100;
    max-width: 380px;
  }
  .toast.err { border-color: var(--danger); }
  .toast.ok { border-color: var(--success); }
</style>
</head>
<body>
  <div id="app" class="container">
    <div class="empty">Loading NetDaemon Deploy dashboard...</div>
  </div>
